<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAE客服管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        .toast-exit { animation: fadeOut 0.3s ease-out forwards; }

        @keyframes flashRed {
            0% { background-color: rgba(239, 68, 68, 0.1); }
            100% { background-color: rgba(239, 68, 68, 0.6); }
        }
        .bg-flash-danger { animation: flashRed 1s infinite alternate; }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

    <header class="bg-indigo-600 text-white shadow-md z-10 shrink-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-server text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">FAE客服管理系統</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- 全域系統資料備份/還原 -->
                <div class="hidden md:flex items-center gap-2 border-r border-indigo-400 pr-4">
                    <label class="cursor-pointer bg-indigo-700/50 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded border border-indigo-500 transition-colors flex items-center gap-1 shadow-sm" title="匯入完整系統資料 (JSON)">
                        <i class="fa-solid fa-cloud-arrow-up"></i> 匯入資料
                        <input type="file" accept=".json" class="hidden" onchange="window.importSystemData(event)">
                    </label>
                    <button onclick="window.exportSystemData()" class="bg-indigo-700/50 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded border border-indigo-500 transition-colors flex items-center gap-1 shadow-sm" title="匯出完整系統資料 (JSON)">
                        <i class="fa-solid fa-cloud-arrow-down"></i> 備份資料
                    </button>
                </div>

                <div class="flex items-center bg-indigo-700/50 rounded-lg p-1 border border-indigo-500 shadow-inner">
                    <i class="fa-solid fa-key text-indigo-300 ml-2 text-sm"></i>
                    <input type="password" id="apiKeyInput" placeholder="輸入 API Key..." class="bg-transparent border-none focus:ring-0 text-sm text-white placeholder-indigo-300 w-32 py-1 px-2 outline-none">
                    <button id="saveApiKeyBtn" onclick="window.toggleApiKey()" class="bg-indigo-500 hover:bg-indigo-400 text-white text-xs px-2 py-1 rounded transition-colors shadow-sm font-medium">儲存</button>
                    <a href="https://aistudio.google.com/app/apikey" target="_blank" class="ml-1 text-indigo-300 hover:text-white text-xs px-2 py-1 transition-colors" title="申請 API Key"><i class="fa-solid fa-link"></i></a>
                </div>
                <div class="text-sm bg-indigo-500/50 px-3 py-1.5 rounded-full border border-indigo-400">
                    <i class="fa-regular fa-clock mr-1"></i> <span id="currentDateDisplay">載入中...</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full py-6">
            <div class="flex flex-col lg:flex-row gap-6 h-full">
                
                <div class="w-full lg:w-1/3 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col overflow-hidden shrink-0">
                    <div class="px-5 py-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                        <h2 id="formTitle" class="font-semibold text-slate-700"><i class="fa-solid fa-pen-to-square mr-2"></i>新增回報紀錄</h2>
                    </div>
                    
                    <div class="p-5 overflow-y-auto flex-1">
                        <form id="issueForm" class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">發生時間 <span class="text-red-500">*</span></label>
                                    <input type="datetime-local" id="f_time" required class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">公司／客戶 <span class="text-red-500">*</span></label>
                                    <input type="text" id="f_company" required placeholder="例: XXX 公司" class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                                </div>
                            </div>
                            
                            <!-- 新增：工作內容欄位 -->
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">工作內容 <span class="text-red-500">*</span></label>
                                <textarea id="f_task_content" required rows="2" placeholder="請簡述本次主要工作內容" class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border"></textarea>
                            </div>

                            <!-- 智慧問題描述選單 -->
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">問題描述 <span class="text-red-500">*</span></label>
                                <input type="text" id="f_desc" list="descOptions" required placeholder="請選擇或自行填入問題描述" class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border bg-white">
                                <datalist id="descOptions">
                                    <option value="新訂單"></option>
                                    <option value="舊客戶新增設備"></option>
                                    <option value="報修ISSU"></option>
                                </datalist>
                            </div>
                            
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">影響範圍 <span class="text-red-500">*</span></label>
                                <input type="text" id="f_impact" required placeholder="例: 單一站點／登入受阻" class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">原因 <span class="text-red-500">*</span></label>
                                <textarea id="f_cause" required rows="2" placeholder="若未知可寫「待確認」並簡述方向" class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border"></textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">目前處理人員 <span class="text-red-500">*</span></label>
                                <select id="f_handler" class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border bg-white">
                                    <option value="待指定" selected>待指定</option>
                                    <option value="FAE">FAE</option>
                                    <option value="RD">RD</option>
                                    <option value="CPM">CPM</option>
                                    <option value="業務">業務</option>
                                </select>
                            </div>
                            <div class="bg-indigo-50/50 p-3 rounded-lg border border-indigo-100">
                                <label class="block text-xs font-medium text-slate-700 mb-2">當下處置方式 <span class="text-red-500">*</span></label>
                                <select id="f_action_type" class="w-full mb-2 rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border bg-white">
                                    <option value="A">(A) 可行 Workaround</option>
                                    <option value="B">(B) 需建 TK 追蹤 (無法立即處理)</option>
                                    <option value="C">(C) 系統限制／待進階評估</option>
                                </select>
                                <textarea id="f_action_desc" required rows="2" placeholder="請清楚寫明步驟、TK編號或原因" class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border"></textarea>
                            </div>
                            
                            <!-- 新增：目前進度欄位 -->
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">目前進度</label>
                                <textarea id="f_progress" rows="2" placeholder="例: 已派工待處理 / 零件調撥中..." class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border"></textarea>
                            </div>

                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">後續改善方向</label>
                                <textarea id="f_improvement" rows="2" placeholder="例: 調整程式碼／加監控告警" class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border"></textarea>
                            </div>

                            <!-- 附件上傳區塊 (拖曳 UI) -->
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">附加檔案 (Log/截圖/文件)</label>
                                <div class="mt-1 flex justify-center px-6 pt-5 pb-5 border-2 border-slate-300 border-dashed rounded-md hover:bg-slate-50 transition-colors cursor-pointer" id="dropZone" onclick="document.getElementById('f_file').click()">
                                    <div class="space-y-1 text-center pointer-events-none">
                                        <i class="fa-solid fa-cloud-arrow-up text-4xl text-slate-400 mb-2"></i>
                                        <div class="flex text-sm justify-center font-medium">
                                            <span class="text-indigo-600">選擇檔案</span>
                                            <span class="text-slate-600 pl-1">或拖曳至此</span>
                                        </div>
                                        <p class="text-xs text-slate-500 pt-1" id="fileListDisplay">尚未選擇檔案</p>
                                    </div>
                                    <input id="f_file" type="file" class="hidden" multiple onchange="window.handleFiles(this.files)">
                                </div>
                                <div id="dirWarning" class="hidden mt-2 text-xs text-amber-600 bg-amber-50 p-2 rounded border border-amber-200">
                                    <i class="fa-solid fa-triangle-exclamation"></i> 尚未設定儲存根目錄，檔案不會自動存檔至本機資料夾。請於右側清單上方設定。
                                </div>
                                <div id="fileListContainer" class="mt-2 space-y-2 empty:hidden"></div>
                            </div>
                            
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">補充 (路徑/指令)</label>
                                <input type="text" id="f_notes" class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                            </div>
                            
                            <!-- 擴充版狀態列 -->
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">目前狀態</label>
                                <div class="flex flex-wrap gap-x-4 gap-y-2">
                                    <label class="flex items-center text-sm cursor-pointer"><input type="radio" name="f_status" value="未處理" checked class="mr-1 text-red-600 focus:ring-red-500"> <span class="text-slate-700">未處理</span></label>
                                    <label class="flex items-center text-sm cursor-pointer"><input type="radio" name="f_status" value="處理中" class="mr-1 text-yellow-600 focus:ring-yellow-500"> <span class="text-slate-700">處理中</span></label>
                                    <label class="flex items-center text-sm cursor-pointer"><input type="radio" name="f_status" value="待後續處理" class="mr-1 text-purple-600 focus:ring-purple-500"> <span class="text-slate-700">待後續處理</span></label>
                                    <label class="flex items-center text-sm cursor-pointer"><input type="radio" name="f_status" value="已完成" class="mr-1 text-green-600 focus:ring-green-500"> <span class="text-slate-700">已完成</span></label>
                                    <label class="flex items-center text-sm cursor-pointer"><input type="radio" name="f_status" value="新訂單客戶未設定" class="mr-1 text-cyan-600 focus:ring-cyan-500"> <span class="text-slate-700">新訂單未設定</span></label>
                                    <label class="flex items-center text-sm cursor-pointer"><input type="radio" name="f_status" value="新訂單客戶設定中" class="mr-1 text-blue-600 focus:ring-blue-500"> <span class="text-slate-700">新訂單設定中</span></label>
                                    <label class="flex items-center text-sm cursor-pointer"><input type="radio" name="f_status" value="RD回報ISUU紀錄" class="mr-1 text-orange-600 focus:ring-orange-500"> <span class="text-slate-700">RD回報ISUU紀錄</span></label>
                                </div>
                            </div>

                            <!-- 新增：狀態變更原因欄位 -->
                            <div>
                                <label class="block text-xs font-medium text-slate-500 mb-1">狀態變更原因 (選填)</label>
                                <input type="text" id="f_status_reason" placeholder="說明變更此狀態的原因..." class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border bg-white">
                            </div>

                            <!-- 單筆紀錄追蹤鬧鐘 -->
                            <div class="border border-indigo-100 rounded-lg overflow-hidden bg-white shadow-sm mt-2">
                                <div class="bg-indigo-50 px-4 py-2 flex items-center justify-between cursor-pointer" onclick="document.getElementById('f_remind_toggle').click()">
                                    <span class="text-sm font-bold text-indigo-900 flex items-center gap-2"><i class="fa-solid fa-clock text-indigo-500"></i> 本紀錄後續追蹤提醒</span>
                                    <div onclick="event.stopPropagation()">
                                        <label class="relative inline-flex items-center cursor-pointer">
                                            <input type="checkbox" id="f_remind_toggle" class="sr-only peer" onchange="window.toggleReportReminderFields(this.checked)">
                                            <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
                                        </label>
                                    </div>
                                </div>
                                <div id="f_reminderFields" class="p-4 space-y-3 hidden">
                                    <div class="grid grid-cols-2 gap-3">
                                        <div>
                                            <label class="block text-xs font-medium text-slate-600 mb-1">追蹤日期與時間</label>
                                            <input type="datetime-local" id="f_appoint_time" class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-medium text-slate-600 mb-1">提醒時機</label>
                                            <select id="f_remind_offset" class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border bg-white" onchange="window.toggleReportCustomTime(this.value)">
                                                <option value="0">準時提醒</option>
                                                <option value="5">前 5 分鐘</option>
                                                <option value="15">前 15 分鐘</option>
                                                <option value="custom">自訂時間</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div id="f_customTimeField" class="hidden">
                                        <label class="block text-xs font-medium text-slate-600 mb-1">自訂提醒時間</label>
                                        <input type="datetime-local" id="f_custom_time" class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                                    </div>
                                    <div class="grid grid-cols-2 gap-3">
                                        <div class="col-span-2 sm:col-span-1">
                                            <label class="block text-xs font-medium text-slate-600 mb-1">提醒內容</label>
                                            <input type="text" id="f_remind_msg" placeholder="預設顯示：本紀錄的問題描述" class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                                        </div>
                                        <div class="col-span-2 sm:col-span-1">
                                            <label class="block text-xs font-medium text-slate-600 mb-1">提醒聲效</label>
                                            <select id="f_remind_sound" class="w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border bg-white">
                                                <option value="beep">嗶嗶聲 (Beep)</option>
                                                <option value="chime">鐘聲 (Chime)</option>
                                                <option value="siren">警報聲 (Siren)</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="flex gap-3 mt-4">
                                <button type="button" id="cancelEditBtn" onclick="window.cancelEdit()" class="hidden flex-1 bg-white hover:bg-slate-50 text-slate-700 font-medium py-2.5 px-4 rounded-md shadow-sm transition-colors flex justify-center items-center gap-2 border border-slate-300">
                                    <i class="fa-solid fa-xmark"></i> 取消修改
                                </button>
                                <button type="submit" id="submitBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-md shadow-sm transition-colors flex justify-center items-center gap-2">
                                    <i class="fa-solid fa-plus"></i> 新增紀錄
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="w-full lg:w-2/3 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col overflow-hidden shrink-0">
                    <div class="px-5 py-4 border-b border-slate-200 bg-slate-50 flex flex-col 2xl:flex-row justify-between items-start 2xl:items-center gap-3">
                        <h2 class="font-semibold text-slate-700 shrink-0"><i class="fa-solid fa-list-check mr-2"></i>異常紀錄清單</h2>
                        
                        <div class="flex flex-wrap gap-2 w-full 2xl:w-auto items-center justify-start 2xl:justify-end">
                            
                            <!-- 全域系統資料備份/還原 -->
                            <div class="flex items-center gap-1 border-r border-slate-300 pr-2 mr-1">
                                <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-2.5 py-1.5 rounded border border-slate-300 transition-colors flex items-center gap-1 shadow-sm" title="匯入完整系統資料 (JSON)">
                                    <i class="fa-solid fa-cloud-arrow-up text-indigo-500"></i> 匯入
                                    <input type="file" accept=".json" class="hidden" onchange="window.importSystemData(event)">
                                </label>
                                <button onclick="window.exportSystemData()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs px-2.5 py-1.5 rounded border border-slate-300 transition-colors flex items-center gap-1 shadow-sm" title="匯出完整系統資料 (JSON)">
                                    <i class="fa-solid fa-cloud-arrow-down text-indigo-500"></i> 備份
                                </button>
                            </div>

                            <button onclick="window.openClientManager()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium h-[34px] px-3 rounded-md shadow-sm transition-colors flex items-center gap-2 shrink-0">
                                <i class="fa-solid fa-address-book"></i> 管理名單
                            </button>

                            <div class="flex items-center bg-slate-100 rounded-md p-1 border border-slate-200 h-[34px] shrink-0">
                                <button onclick="window.setTimeViewMode('all')" id="btnViewAll" class="view-mode-btn px-2.5 h-full text-xs font-medium rounded text-slate-500 hover:text-slate-800 transition-colors">全部</button>
                                <button onclick="window.setTimeViewMode('month')" id="btnViewMonth" class="view-mode-btn px-2.5 h-full text-xs font-medium rounded bg-white text-indigo-600 shadow-sm transition-colors">月</button>
                                <button onclick="window.setTimeViewMode('week')" id="btnViewWeek" class="view-mode-btn px-2.5 h-full text-xs font-medium rounded text-slate-500 hover:text-slate-800 transition-colors">週</button>
                            </div>

                            <div id="monthFilterContainer" class="flex items-center bg-white border border-slate-300 rounded-md shadow-sm px-2 h-[34px]">
                                <i class="fa-regular fa-calendar text-slate-400 mr-2 text-sm"></i>
                                <select id="monthFilter" class="bg-transparent border-none focus:ring-0 text-sm py-1 pl-0 pr-6 text-slate-700 cursor-pointer h-full outline-none"></select>
                            </div>

                            <!-- 報表匯出與存檔工具群 (乾淨整合版) -->
                            <div class="flex items-center gap-1 shrink-0">
                                <button type="button" id="setAttachmentDirBtn" onclick="window.handleSetAttachmentRootDir()" class="bg-amber-500 hover:bg-amber-600 text-white text-sm font-medium h-[34px] px-3 rounded-md shadow-sm transition-colors flex items-center gap-2" title="設定/修改附件自動存檔資料夾">
                                    <i class="fa-solid fa-folder-open"></i> 附件根目錄
                                </button>

                                <button type="button" id="setSaveDirBtn" class="bg-amber-500 hover:bg-amber-600 text-white text-sm font-medium h-[34px] px-3 rounded-md shadow-sm transition-colors flex items-center gap-2" title="設定/修改報表自動存檔資料夾">
                                    <i class="fa-solid fa-folder-open"></i> 報表存檔路徑
                                </button>
                                
                                <button id="smartExportBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium h-[34px] px-3 rounded-md shadow-sm transition-colors flex items-center gap-1" title="匯出報表 (自動記憶路徑)">
                                    <i class="fa-solid fa-file-excel"></i> 匯出報表
                                </button>
                            </div>

                        </div>
                    </div>
                    
                    <div class="bg-slate-50/80 border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-inner">
                        <button onclick="window.changeWeek(-1)" class="w-8 h-8 flex items-center justify-center rounded-full bg-white border border-slate-200 shadow-sm hover:bg-slate-100 text-slate-500 transition-colors shrink-0"><i class="fa-solid fa-chevron-left"></i></button>

    <script>
        // --- 核心狀態變數 ---
        let reports = [];
        let clientsData = [];
        let editingId = null;
        let editingClientId = null;
        let currentStatusFilter = '全部';
        let timeViewMode = 'month';
        let activeFilterDate = null;
        let displayWeekStart = new Date();
        displayWeekStart.setDate(displayWeekStart.getDate() - displayWeekStart.getDay());
        let currentRingingClient = null;
        let alarmSoundInterval = null;
        let excelExportDirHandle = null; 
        let pendingStatusChange = null;

        // File System Handlers
        let currentAttachedFiles = []; 
        let attachmentRootDirHandle = null;

        // --- IndexedDB for File System Handles (記憶資料夾路徑) ---
        const handleDBName = 'FAE_Handles_DB';
        let handleDB = null;
        
        const initHandleDB = () => {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(handleDBName, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('dirHandles')) {
                        db.createObjectStore('dirHandles', { keyPath: 'id' });
                    }
                };
                req.onsuccess = (e) => { handleDB = e.target.result; resolve(handleDB); };
                req.onerror = () => reject('IndexedDB Error');
            });
        };

        const saveHandleToDB = async (id, handle) => {
            if (!handleDB) await initHandleDB();
            const tx = handleDB.transaction('dirHandles', 'readwrite');
            tx.objectStore('dirHandles').put({ id, handle });
        };

        const getHandleFromDB = async (id) => {
            if (!handleDB) await initHandleDB();
            return new Promise((resolve) => {

        // --- 音效引擎 (Web Audio API) ---
        window.AudioEngine = {
            ctx: null,
            init: function() {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                } catch(e) { console.warn("Web Audio API not supported"); }
            },
            play: function(type) {
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                const now = this.ctx.currentTime;
                if (type === 'beep') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, now);
                    gain.gain.setValueAtTime(0.1, now);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'chime') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 1);
                    osc.start(now); osc.stop(now + 1);
                } else if (type === 'siren') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.linearRampToValueAtTime(800, now + 0.5);
                    gain.gain.setValueAtTime(0.1, now);
                    osc.start(now); osc.stop(now + 0.5);
                } else {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(440, now);
                    gain.gain.setValueAtTime(0.1, now); osc.start(now); osc.stop(now + 0.3);
                }
            }
        };

        const getDurationStr = (startStr, endStr) => {
            if (!startStr || !endStr) return '';
            const diff = new Date(endStr).getTime() - new Date(startStr).getTime();
            if (diff < 0) return '時間異常';
            const mins = Math.floor(diff / 60000);
            const d = Math.floor(mins / 1440);
            const h = Math.floor((mins % 1440) / 60);
            const m = mins % 60;
            let res = [];
            if(d > 0) res.push(`${d}天`);
            if(h > 0) res.push(`${h}小時`);
            if(m > 0 || res.length === 0) res.push(`${m}分鐘`);
            return res.join(' ');
        };

            if (s.includes('未過保') || s.includes('未到期') || s.includes('正常') || s.includes('保內')) return 'bg-green-50 text-green-600 font-medium';

                try {
                    const data = JSON.parse(e.target.result);
                    let importMsg = [];
                    
                    if (data.reports && Array.isArray(data.reports)) {
                        let newReportsCount = 0;
                        let updatedReportsCount = 0;
                        let skippedReportsCount = 0;

                        data.reports.forEach(importedReport => {
                            const existIdx = reports.findIndex(r => r.id === importedReport.id || (r.company === importedReport.company && r.time === importedReport.time));
                            
                            if (existIdx > -1) {
                                const existingReport = reports[existIdx];
                                
                                const existingLatestTime = existingReport.statusHistory && existingReport.statusHistory.length > 0 
                                    ? existingReport.statusHistory[existingReport.statusHistory.length - 1].timestamp 
                                    : existingReport.timestamp;
                                    
                                const importedLatestTime = importedReport.statusHistory && importedReport.statusHistory.length > 0 
                                    ? importedReport.statusHistory[importedReport.statusHistory.length - 1].timestamp 
                                    : importedReport.timestamp;

                                if (importedLatestTime >= existingLatestTime) {
                                    reports[existIdx] = { ...existingReport, ...importedReport };
                                    updatedReportsCount++;
                                } else {
                                    skippedReportsCount++; 
                                }
                            } else {
                                reports.push(importedReport);
                                newReportsCount++;
                            }
                        });
                        importMsg.push(`紀錄 (新增${newReportsCount}, 更新${updatedReportsCount}, 略過較舊資料${skippedReportsCount})`);
                    }

                    if (data.clientsData && Array.isArray(data.clientsData)) {
                        let newClientsCount = 0;
                        let updatedClientsCount = 0;

                        data.clientsData.forEach(importedClient => {
                            const existIdx = clientsData.findIndex(c => c.company === importedClient.company);

                            }

        window.handleImportClients = (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false, defval: "" });
                    
                    let headerRowIndex = -1;
                    let headerMap = {};
                    
                    for (let i = 0; i < Math.min(rows.length, 30); i++) {
                        const row = rows[i];
                        if (!row || !Array.isArray(row)) continue;
                        
                        const normalizedRow = row.map(cell => String(cell).replace(/[\s\n\r ]/g, '').toLowerCase());
                        
                        const compIdx = normalizedRow.findIndex(cell => cell.includes('公司') || cell.includes('客戶') || cell === 'company');
                        
                        if (compIdx !== -1) {
                            headerRowIndex = i;
                            normalizedRow.forEach((colName, idx) => {
                                if (colName) headerMap[colName] = idx;
                            });
                            break;
                        }
                    }

                    if (headerRowIndex === -1) {
                        showToast('找不到「公司」或「客戶」標題，請確認 Excel 內容', 'error');
                        e.target.value = '';
                        return;
                    }

                    let importCount = 0;
                    
                    for (let i = headerRowIndex + 1; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row || !Array.isArray(row)) continue;
                        
                        const getVal = (keywords) => {
                            for (const key in headerMap) {
                                if (keywords.some(kw => key.includes(kw.toLowerCase()))) {
                                    const val = row[headerMap[key]];
                                    return val !== undefined && val !== null ? String(val).trim() : '';
                                }
                            }
                            return '';
                        };

                        const companyName = getVal(['公司', '客戶', 'company']);
                        
                        if (companyName && companyName !== '總計' && companyName !== '合計') {
                            const existIdx = clientsData.findIndex(c => c.company === companyName);
                            
                            const extractedData = {
                                company: companyName,
                                sales: getVal(['業務']),
                                source: getVal(['來源', 'source']),
                                entryDate: getVal(['驗收', '進場', 'date']),
                                hwExpiry: getVal(['硬體保固', '硬體到期', '硬體維運', '硬體']),
                                hwStatus: getVal(['硬體狀態', 'hwstatus']),
                                swExpiry: getVal(['軟體維運', '軟體到期', '軟體']),
                                swStatus: getVal(['軟體狀態', 'swstatus'])
                            };

                            if(existIdx > -1) {
                                clientsData[existIdx] = { 
                                    ...clientsData[existIdx], 
                                    ...extractedData 
                                };
                            } else {
                                const newObj = {
                                    ...extractedData,
                                    id: 'c-' + Date.now() + Math.random().toString(36).substr(2, 5),
                                    reminderEnabled: false
                                };
                                clientsData.push(newObj);
                            }
                            importCount++;
                        }
                    }
                    
                    saveToLocalStorage(); 

                    window.renderClientList();
                    window.renderList();
                    if(importCount > 0) {
                        showToast(`成功匯入/更新 ${importCount} 筆資料！`, 'success');
                    } else {
                        showToast('已讀取檔案，但找不到有效的客戶資料列', 'error');
                    }
                } catch(err) {
                    console.error(err);
                    showToast('匯入失敗，無法解析該 Excel 檔案', 'error');
                }
                e.target.value = ''; 
            };
            reader.readAsArrayBuffer(file);
        };

                dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);

            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, e => { e.preventDefault(); e.stopPropagation(); }, false);
                dropZone.addEventListener(eventName, () => dropZone.classList.remove('bg-indigo-50', 'border-indigo-400'), false);

            dropZone.addEventListener('drop', (e) => window.handleFiles(e.dataTransfer.files), false);
            fileInput.addEventListener('change', function() { window.handleFiles(this.files); });

                display.textContent = '尚未選擇檔案';

                display.textContent = `已選擇 ${currentAttachedFiles.length} 個檔案`;

                currentAttachedFiles = [];

                Array.from(files).forEach(newFile => {
                    if (!currentAttachedFiles.some(existing => existing.name === newFile.name)) {
                        currentAttachedFiles.push(newFile);
                    }
                });

                if(btn) {

                    showToast('系統限制：目前預覽環境無法使用本機資料夾選取功能', 'error');

        window.saveFilesToLocalFileSystem = async (companyName, dateString, filesToSave) => {
            if (!attachmentRootDirHandle || filesToSave.length === 0) return true; 
            
            const hasPermission = await verifyPermission(attachmentRootDirHandle, true);
            if (!hasPermission) {
                showToast('未獲得附件目錄的寫入權限，請重新授權', 'error');
                return false;
            }

            try {
                const safeCompanyName = companyName.replace(/[\\/:*?"<>|]/g, '_') || '未命名公司';
                const companyDirHandle = await attachmentRootDirHandle.getDirectoryHandle(safeCompanyName, { create: true });
                const dateDirHandle = await companyDirHandle.getDirectoryHandle(dateString, { create: true });

                for (const file of filesToSave) {
                    const fileHandle = await dateDirHandle.getFileHandle(file.name, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(file);
                    await writable.close();
                }
                return true;
            } catch (error) {
                console.error('File saving failed:', error);
                throw error;
            }

                        showToast(`附件已自動存入: ${companyName}/${dateString}/`, 'success');
                    }
                }
                const attachmentsMeta = attachmentsToSave.map(f => ({ name: f.name, type: f.type }));

                let reportToUpdate = editingId ? reports.find(r => r.id === editingId) : null;
                
                const reportData = {
                    time: issueTime,
                    company: companyName,
                    taskContent: taskContent,
                    desc: document.getElementById('f_desc').value.trim(),
                    impact: document.getElementById('f_impact').value.trim(),
                    cause: document.getElementById('f_cause').value.trim(),
                    handler: document.getElementById('f_handler').value,
                    actionType: document.getElementById('f_action_type').value,
                    actionDesc: document.getElementById('f_action_desc').value.trim(),
                    progress: document.getElementById('f_progress').value.trim(),
                    improvement: document.getElementById('f_improvement').value.trim(),
                    notes: document.getElementById('f_notes').value.trim(),
                    status: selectedStatus,
                    timestamp: new Date(issueTime).getTime(),
                    reminderEnabled: document.getElementById('f_remind_toggle').checked,
                    reminderTriggered: false
                };

                if(attachmentsMeta.length > 0) reportData.attachments = attachmentsMeta;

                if (reportData.reminderEnabled) {
                    reportData.appointmentDate = document.getElementById('f_appoint_time').value;
                    reportData.reminderOffset = document.getElementById('f_remind_offset').value;
                    reportData.customReminderDate = document.getElementById('f_custom_time').value;
                    reportData.reminderMsg = document.getElementById('f_remind_msg').value.trim();
                    reportData.reminderSound = document.getElementById('f_remind_sound').value;

                    if (reportData.reminderOffset === 'custom' && reportData.customReminderDate) {
                        const parsedTime = new Date(reportData.customReminderDate).getTime();
                        reportData.reminderTriggerTime = isNaN(parsedTime) ? null : parsedTime;
                    } else if (reportData.appointmentDate) {
                        const aptTime = new Date(reportData.appointmentDate).getTime();
                        if (!isNaN(aptTime)) {
                            const offsetMins = parseInt(reportData.reminderOffset) || 0;
                            reportData.reminderTriggerTime = aptTime - (offsetMins * 60000);
                        } else {
                            reportData.reminderTriggerTime = null;
                        }
                    } else {
                        reportData.reminderTriggerTime = null; 
                    }
                } else {
                    reportData.reminderTriggerTime = null;
                }

                if (reportToUpdate) {
                    let currentHistory = reportToUpdate.statusHistory ? [...reportToUpdate.statusHistory] : [];
                    
                    const isContentChanged = (
                        reportToUpdate.taskContent !== taskContent ||
                        reportToUpdate.desc !== reportData.desc ||
                        reportToUpdate.impact !== reportData.impact ||
                        reportToUpdate.cause !== reportData.cause ||
                        reportToUpdate.actionType !== reportData.actionType ||
                        reportToUpdate.actionDesc !== reportData.actionDesc ||
                        reportToUpdate.progress !== reportData.progress ||
                        reportToUpdate.improvement !== reportData.improvement ||
                        reportToUpdate.notes !== reportData.notes ||
                        reportToUpdate.handler !== reportData.handler
                    );

                    if (reportToUpdate.status !== selectedStatus || statusReason !== '' || reportToUpdate.time !== issueTime || isContentChanged) {
                        
                        let finalReason = '';
                        
                        if (statusReason !== '') {
                            finalReason = statusReason;
                        } else {
                            if (reportToUpdate.status !== selectedStatus) {
                                finalReason = '狀態變更';
                            } else if (reportToUpdate.time !== issueTime) {
                                finalReason = '變更發生時間';
                            } else if (reportToUpdate.handler !== reportData.handler) {
                                finalReason = '變更處理人員';
                            } else if (isContentChanged) {
                                finalReason = '更新內容/進度';
                            }
                        }

                        currentHistory.push({ 
                            status: selectedStatus, 
                            timestamp: Date.now(),
                            reason: finalReason 
                        });
                    }
                    
                    reportData.statusHistory = currentHistory;

                    if (selectedStatus === '已完成' && reportToUpdate.status !== '已完成') {
                        reportData.completedTime = new Date().toISOString();
                    } else if (selectedStatus !== '已完成') {
                        reportData.completedTime = null;
                    } else {
                        reportData.completedTime = reportToUpdate.completedTime;
                    }
                    
                    Object.assign(reportToUpdate, reportData);
                    showToast('回報紀錄修改成功！', 'success');
                    window.cancelEdit();
                } else {
                    reportData.id = 'rep-' + Date.now();
                    reportData.statusHistory = [{ status: selectedStatus, timestamp: Date.now(), reason: statusReason || '新建紀錄' }];
                    if (selectedStatus === '已完成') reportData.completedTime = new Date().toISOString();
                    reports.push(reportData);
                    showToast('回報紀錄新增成功！', 'success');
                    document.getElementById('issueForm').reset();
                    
                    document.getElementById('f_remind_toggle').checked = false;
                    window.toggleReportReminderFields(false);
                    document.getElementById('f_status_reason').value = '';
                    currentAttachedFiles = [];
                    window.renderAttachedFiles();
                    
                    const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                    document.getElementById('f_time').value = now.toISOString().slice(0, 16);
                }
                
                reports.sort((a, b) => b.timestamp - a.timestamp);
                saveToLocalStorage(); 
                updateMonthFilter();
                document.getElementById('monthFilter').value = getMonthKey(new Date(issueTime));
                activeFilterDate = getDayKey(new Date(issueTime));
                displayWeekStart = new Date(issueTime);
                displayWeekStart.setDate(displayWeekStart.getDate() - displayWeekStart.getDay());
                window.renderCalendarStrip();
                window.renderList();
            } finally {
                submitBtn.innerHTML = originalBtnHtml;
                submitBtn.disabled = false;
            }
        }

        window.changeStatus = (selectElem, id) => {
            const report = reports.find(r => r.id === id);
            if(report) {
                if (report.status !== selectElem.value) {
                    pendingStatusChange = { id: id, newStatus: selectElem.value, elem: selectElem, oldStatus: report.status };
                    document.getElementById('pendingStatusText').textContent = selectElem.value;
                    document.getElementById('statusReasonModal').classList.remove('hidden');
                    document.getElementById('statusReasonModal').classList.add('flex');
                    document.getElementById('status_change_reason_input').value = '';
                    document.getElementById('status_change_reason_input').focus();
                }
            }
        };

        window.confirmStatusChange = () => {
            if (!pendingStatusChange) return;
            const reason = document.getElementById('status_change_reason_input').value.trim();
            const { id, newStatus } = pendingStatusChange;
            const report = reports.find(r => r.id === id);
            
            if (report) {
                if (!report.statusHistory) report.statusHistory = [];
                report.statusHistory.push({ status: newStatus, timestamp: Date.now(), reason: reason });
                report.status = newStatus;
                
                if (newStatus === '已完成') report.completedTime = new Date().toISOString();
                else report.completedTime = null;
                
                saveToLocalStorage(); 
                window.renderList();
                showToast(`狀態已更新為：${newStatus}`, 'success');
            }
            window.closeStatusReasonModal();
        };

        window.cancelStatusChange = () => {
            if (pendingStatusChange && pendingStatusChange.elem) {
                pendingStatusChange.elem.value = pendingStatusChange.oldStatus;
            }
            window.closeStatusReasonModal();
        };

        window.closeStatusReasonModal = () => {
            document.getElementById('statusReasonModal').classList.add('hidden');
            document.getElementById('statusReasonModal').classList.remove('flex');
            pendingStatusChange = null;
        };

            if(report) {
                report.handler = selectElem.value;
                saveToLocalStorage(); 
                window.renderList();
                showToast(`處理人員更新為：${selectElem.value}`, 'success');

        window.exportSingleReport = async (id) => {
            const r = reports.find(x => x.id === id);
            if (!r) return;

            const wsData = [{
                '開始時間': new Date(r.time).toLocaleString('zh-TW', {hour12: false}),
                '結束時間': r.completedTime ? new Date(r.completedTime).toLocaleString('zh-TW', {hour12: false}) : '',
                '公司/客戶': r.company,
                '工作內容': r.taskContent || '',
                '處理人員': r.handler || '待指定',
                '狀態': r.status,
                '問題描述': r.desc,
                '影響範圍': r.impact,
                '原因': r.cause,
                '處置類型': r.actionType,
                '當下處置': r.actionDesc,
                '目前進度': r.progress || '',
                '後續改善': r.improvement || '',
                '狀態歷程': (r.statusHistory || []).map(h => {
                    const hDate = new Date(h.timestamp).toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
                    const reasonStr = h.reason ? `[${h.reason}]` : '';
                    return `${h.status}${reasonStr}(${hDate})`;
                }).join(' -> '),
                '補充': r.notes || ''
            }];
            const ws = XLSX.utils.json_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "異常紀錄");
            
            const dateObj = new Date(r.time);
            const dateString = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
            const safeCompanyName = r.company.replace(/[\\/:*?"<>|]/g, '_') || '未命名公司';
            const filename = `單筆報表_${safeCompanyName}_${dateString}_${r.timestamp}.xlsx`;

            if (!window.showDirectoryPicker) {
                XLSX.writeFile(wb, filename);
                return showToast('單筆報表匯出成功', 'success');
            }

            if (excelExportDirHandle) {
                const hasPerm = await verifyPermission(excelExportDirHandle, true);
                if (!hasPerm) excelExportDirHandle = null; 
            }

            if (!excelExportDirHandle) {
                try {
                    excelExportDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                    await saveHandleToDB('exportDir', excelExportDirHandle); 
                    const btn = document.getElementById('setSaveDirBtn');
                    if(btn) {
                        btn.innerHTML = `<i class="fa-solid fa-folder-check"></i> 報表路徑已設`;
                        btn.classList.remove('bg-amber-500', 'hover:bg-amber-600');
                        btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                    }
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        XLSX.writeFile(wb, filename);
                        showToast('環境限制，已自動改用一般下載', 'success');
                    }
                    return; 
                }
            }

            try {
                const companyDirHandle = await excelExportDirHandle.getDirectoryHandle(safeCompanyName, { create: true });
                const dateDirHandle = await companyDirHandle.getDirectoryHandle(dateString, { create: true });
                const excelData = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                const fileHandle = await dateDirHandle.getFileHandle(filename, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(excelData);
                await writable.close();
                showToast(`報表已存入：${safeCompanyName}/${dateString}/`, 'success');
            } catch (error) {
                console.error(error);
                XLSX.writeFile(wb, filename);
                showToast('寫入失敗，已自動改用一般下載', 'info');
            }
        };

        window.cancelEdit = () => {
            editingId = null;
            document.getElementById('issueForm').reset();
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square mr-2"></i>新增回報紀錄';
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-plus"></i> 新增紀錄';
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('f_status_reason').value = ''; 
            
            document.getElementById('f_remind_toggle').checked = false;
            window.toggleReportReminderFields(false);
            
            currentAttachedFiles = [];
            window.renderAttachedFiles();

            const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('f_time').value = now.toISOString().slice(0, 16);
            window.renderList();
        };

        function getMonthKey(date) { return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`; }
        function getDayKey(date) { return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`; }

        window.renderCalendarStrip = () => {
            const container = document.getElementById('calendarDays');
            if (!container) return;
            container.innerHTML = '';
            const daysOfWeek = ['日', '一', '二', '三', '四', '五', '六'];
            const todayStr = getDayKey(new Date());
            
            for(let i=0; i<7; i++) {
                let d = new Date(displayWeekStart);
                d.setDate(d.getDate() + i);
                let dateStr = getDayKey(d);
                
                let isSelected = (dateStr === activeFilterDate);
                let isToday = (dateStr === todayStr);
                let hasReports = reports.some(r => r.time.startsWith(dateStr));

                let bgClass = isSelected ? "bg-indigo-600 text-white shadow-md ring-2 ring-indigo-200" : "bg-white text-slate-600 hover:bg-indigo-50 hover:border-indigo-200 border border-slate-200";
                let textClass = isSelected ? "text-white" : (isToday ? "text-indigo-700" : "text-slate-400");
                let dotHtml = hasReports ? `<span class="absolute top-1 right-1.5 w-2 h-2 rounded-full ${isSelected ? 'bg-white' : 'bg-red-500'} ring-1 ring-white"></span>` : '';

                container.innerHTML += `
                    <div onclick="window.setDateFilter('${dateStr}')" class="relative cursor-pointer flex flex-col items-center justify-center w-11 sm:w-14 h-12 sm:h-[52px] rounded-lg transition-all ${bgClass} shrink-0 group">
                        <span class="text-[11px] font-medium mb-0.5 ${textClass}">${daysOfWeek[d.getDay()]}</span>
                        <span class="text-sm sm:text-[17px] font-bold leading-none ${isToday && !isSelected ? 'text-indigo-600' : ''}">${d.getDate()}</span>
                        ${dotHtml}
                    </div>
                `;
            }
        };

        window.changeWeek = (offset) => {
            displayWeekStart.setDate(displayWeekStart.getDate() + (offset * 7));
            const filter = document.getElementById('monthFilter');
            const monthKey = getMonthKey(displayWeekStart);
            if([...filter.options].some(opt => opt.value === monthKey)) filter.value = monthKey;
            activeFilterDate = null;
            window.renderCalendarStrip(); window.renderList();
        };

        window.setDateFilter = (dateStr) => {
            activeFilterDate = (activeFilterDate === dateStr) ? null : dateStr;
            if (activeFilterDate) {
                const [y, m] = dateStr.split('-');
                const filter = document.getElementById('monthFilter');
                if([...filter.options].some(opt => opt.value === `${y}-${m}`)) filter.value = `${y}-${m}`;
            }
            window.renderCalendarStrip(); window.renderList();
        };

        window.resetToToday = () => {
            let today = new Date();
            displayWeekStart = new Date(today);
            displayWeekStart.setDate(displayWeekStart.getDate() - displayWeekStart.getDay());
            activeFilterDate = getDayKey(today);
            const filter = document.getElementById('monthFilter');
            if([...filter.options].some(opt => opt.value === getMonthKey(today))) filter.value = getMonthKey(today);
            window.renderCalendarStrip(); window.renderList();
        };

        function updateMonthFilter() {
            const filter = document.getElementById('monthFilter');
            const currentValue = filter.value;
            const months = new Set();
            reports.forEach(r => months.add(getMonthKey(new Date(r.time))));
            months.add(getMonthKey(new Date()));
            const sorted = Array.from(months).sort().reverse();
            filter.innerHTML = '';
            sorted.forEach(m => {
                filter.innerHTML += `<option value="${m}">${m.replace('-','年 ')}月</option>`;
            });
            if (currentValue && sorted.includes(currentValue)) filter.value = currentValue;
        }

        async function handleSmartExport() {
            const m = document.getElementById('monthFilter').value;
            const filtered = reports.filter(r => getMonthKey(new Date(r.time)) === m);
            if (filtered.length === 0) return showToast('沒有資料可匯出', 'error');

            const wsData = filtered.map(r => {
                let duration = '', endT = '';
                if(r.status === '已完成' && r.completedTime) {
                    endT = new Date(r.completedTime).toLocaleString('zh-TW', {hour12: false});
                    duration = getDurationStr(r.time, r.completedTime);
                }
                
                const cData = clientsData.find(c => c.company === r.company) || {};
                
                return {
                    '開始時間': new Date(r.time).toLocaleString('zh-TW', {hour12: false}),
                    '結束時間': endT,
                    '總處理耗時': duration,
                    '公司/客戶': r.company,
                    '工作內容': r.taskContent || '',
                    '處理人員': r.handler || '待指定',
                    '狀態': r.status,
                    '業務人員': cData.sales || '',
                    '來源': cData.source || '',
                    '硬體保固到期': cData.hwExpiry || '',
                    '硬體狀態': cData.hwStatus || '',
                    '軟體維運到期': cData.swExpiry || '',
                    '軟體狀態': cData.swStatus || '',
                    '問題描述': r.desc,
                    '影響範圍': r.impact,
                    '原因': r.cause,
                    '處置類型': r.actionType,
                    '當下處置': r.actionDesc,
                    '目前進度': r.progress || '',
                    '後續改善': r.improvement || '',
                    '狀態歷程': (r.statusHistory || []).map(h => {
                        const hDate = new Date(h.timestamp).toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
                        const reasonStr = h.reason ? `[${h.reason}]` : '';
                        return `${h.status}${reasonStr}(${hDate})`;
                    }).join(' -> ')
                };
            });
            const ws = XLSX.utils.json_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "月報表");
            const filename = `FAE月報_${m}.xlsx`;

            if (!window.showDirectoryPicker) {
                XLSX.writeFile(wb, filename);
                return showToast('報表匯出成功', 'success');
            }

            if (excelExportDirHandle) {
                const hasPerm = await verifyPermission(excelExportDirHandle, true);
                if (!hasPerm) excelExportDirHandle = null; 
            }

            if (!excelExportDirHandle) {
                try {
                    excelExportDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                    await saveHandleToDB('exportDir', excelExportDirHandle); 
                    const btn = document.getElementById('setSaveDirBtn');
                    if(btn) {
                        btn.innerHTML = `<i class="fa-solid fa-folder-check"></i> 報表路徑已設`;
                        btn.classList.remove('bg-amber-500', 'hover:bg-amber-600');
                        btn.classList.add('bg-blue-600', 'hover:bg-blue-700');
                    }
                    showToast(`已記憶報表匯出路徑：${excelExportDirHandle.name}`, 'info');
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        // 遇到權限阻擋時，自動降級為一般下載
